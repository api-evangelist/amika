openapi: 3.1.0
info:
  title: Amika API — v0beta1 API keys Docker registries API
  version: 0beta1
tags:
- name: Docker registries
paths:
  /docker-registries:
    get:
      tags:
      - Docker registries
      summary: List the org's docker registries
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Array of docker registries owned by the caller's org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDockerRegistriesResponse'
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '403':
          description: Error
          headers:
            x-trace-id:
