components:
  schemas:
    DockerRegistry:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        url:
          type: string
        daytona_registry_id:
          type: string
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        username:
          type: string
          nullable: true
        registry_type:
          type: string
          nullable: true
      required:
      - id
      - org_id
      - name
      - url
      - daytona_registry_id
      - created_at
      - updated_at
    CreateDockerRegistryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        project:
          type: string
      required:
      - name
      - url
      - username
      - password
    ListDockerRegistriesResponse:
      type: array
      items:
        $ref: '#/components/schemas/DockerRegistry'
