      tags:
      - Docker registries
      summary: Register a docker registry
      security:
      - bearerAuth: []
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDockerRegistryRequest'
      responses:
        '201':
          description: Created docker registry row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DockerRegistry'
        '400':
          description: Error
          headers:
