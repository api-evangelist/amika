components:
  schemas:
    UploadBatchResponse:
      type: object
      properties:
        bucket:
          type: string
        objects:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              upload_url:
                type: string
              token:
                type: string
            required:
            - path
            - upload_url
            - token
        expires_in:
          type: integer
      required:
      - bucket
      - objects
      - expires_in
    CreateUploadBatchRequest:
      type: object
      properties:
        files:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
                minLength: 1
              upsert:
                type: boolean
                default: false
            required:
            - filename
          minItems: 1
          maxItems: 100
      required:
      - files
    UploadResponse:
      type: object
      properties:
        bucket:
          type: string
        path:
          type: string
        upload_url:
          type: string
        token:
          type: string
        expires_in:
          type: integer
      required:
      - bucket
      - path
      - upload_url
      - token
      - expires_in
    CreateUploadRequest:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
        upsert:
          type: boolean
          default: false
      required:
      - filename
