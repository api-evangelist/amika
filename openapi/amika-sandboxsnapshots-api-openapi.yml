      - env_vars
    ExperimentalDaytonaSnapshot:
      type: object
      nullable: true
      properties:
        name:
          type: string
        state:
          type: string
        imageName:
          type: string
        cpu:
          type: number
        memory:
          type: number
        disk:
          type: number
        createdAt:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updatedAt:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - name
      additionalProperties:
        nullable: true
    SandboxSnapshot:
      type: object
      properties:
        id:
          type: string
        snapshot:
          type: string
        provider:
          type: string
        host_id:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        source_sandbox_id:
          type: string
          nullable: true
        source_sandbox_name:
          type: string
          nullable: true
        repository_id:
          type: string
          nullable: true
        repository_url:
          type: string
          nullable: true
        base_snapshot:
          type: string
          nullable: true
        sandbox_preset:
          type: string
          nullable: true
        sandbox_size:
          type: string
          nullable: true
        capture_mode:
          type: string
          nullable: true
        state:
          type: string
        error_message:
          type: string
          nullable: true
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        daytona:
          $ref: '#/components/schemas/ExperimentalDaytonaSnapshot'
      required:
      - id
      - snapshot
      - provider
      - host_id
      - description
      - source_sandbox_id
      - source_sandbox_name
      - repository_id
      - repository_url
      - base_snapshot
      - sandbox_preset
      - sandbox_size
      - capture_mode
      - state
      - error_message
      - created_at
      - updated_at
      - daytona
    ListSandboxSnapshotsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SandboxSnapshot'
      required:
      - items
    CreateSandboxSnapshotRequest:
      type: object
      properties:
        sandbox_id:
          type: string
          minLength: 1
          description: Source sandbox, by id.
        sandbox_name:
          type: string
          minLength: 1
          description: Source sandbox, by name.
        sandbox_ref:
          type: string
          minLength: 1
          description: Source sandbox, by id or name; rejected if both match.
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        mode:
          type: string
          enum:
          - scrub_and_delete
          - full
          default: scrub_and_delete
          description: 'scrub_and_delete (default): remove Amika-injected secrets (credential files + injected env vars) from the sandbox, capture the snapshot from the clean filesystem, then delete the source sandbox. full: capture everything as-is — including secrets — and keep the sandbox running.'
      required:
      - name
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token: an Amika CLI session token or an Amika API key.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: wos-session
      description: Browser session cookie set after sign-in.
