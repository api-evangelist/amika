      - SandboxSnapshots
      summary: List sandbox-captured snapshots for the caller's org
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - schema:
          type: string
          description: If set, only return snapshots taken from sandboxes attached to this repository.
        required: false
        description: If set, only return snapshots taken from sandboxes attached to this repository.
        name: repository_id
        in: query
      - schema:
          type: string
          description: If set, only return snapshots captured from this sandbox.
        required: false
        description: If set, only return snapshots captured from this sandbox.
        name: source_sandbox_id
        in: query
      responses:
        '200':
          description: Snapshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSandboxSnapshotsResponse'
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '403':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
