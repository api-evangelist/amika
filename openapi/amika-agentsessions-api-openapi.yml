openapi: 3.2.0
info:
  title: Amika Agent Sessions API
  version: 0beta
  description: HTTP API for Amika coding agents. Versioned per Google AIP-185.
tags:
- name: AgentSessions
paths:
  /api/v0beta1/agent-sessions:
    post:
      tags:
      - AgentSessions
      summary: Send a message to a coding agent, creating a sandbox if needed
      security:
      - bearerAuth: []
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionSendRequest'
      responses:
        '200':
          description: Agent response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionSendResponse'
        '400':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
