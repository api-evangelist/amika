                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
      operationId: getApiV0beta1AgentSessions
      x-operation-id-source: derived
  /api/v0beta1/agent-sessions/stream:
    post:
      tags:
      - AgentSessions
      summary: Send a message to a coding agent, streaming the reply (SSE)
      security:
      - bearerAuth: []
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionSendRequest'
      responses:
        '200':
          description: 'A `text/event-stream` of the send. Frames are named by the SSE `event:` field: `status`, `delta`, terminal `done` (the full `AgentSessionSendResponse`), or `error`.'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AgentSessionStreamFrame'
        '400':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
