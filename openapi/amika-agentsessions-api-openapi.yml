                - message
      operationId: getApiV0beta1AgentSessionsById
      x-operation-id-source: derived
  /api/v0beta1/agent-sessions/{id}/events:
    get:
      tags:
      - AgentSessions
      summary: Stream a session's events (SSE)
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: id
        in: path
      - schema:
          type: string
          pattern: ^\d+$
        required: false
        name: after_seq
        in: query
      - schema:
          type: string
          pattern: ^\d+$
        required: false
        name: max_ms
        in: query
      - schema:
          type: string
          enum:
          - '0'
          - '1'
          - 'true'
          - 'false'
          - 'yes'
          - 'no'
        required: false
        name: follow
        in: query
      - schema:
          type: string
          enum:
          - '0'
          - '1'
          - 'true'
          - 'false'
        required: false
        name: include_raw
        in: query
      responses:
        '200':
          description: A `text/event-stream` of the session's events. Each event frame's `id` is the event `seq` (a resume cursor); `event` is the kind. Control frames `done`/`timeout`/`heartbeat`/`error` are also sent.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AgentSessionEventFrame'
        '400':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '403':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '404':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
