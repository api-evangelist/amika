      operationId: getApiV0beta1AgentSessionsByIdEvents
      x-operation-id-source: derived
components:
  schemas:
    AgentSessionUsage:
      type: object
      properties:
        cost_usd:
          type: number
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        cache_creation_tokens:
          type: integer
          minimum: 0
        duration_ms:
          type: integer
          minimum: 0
        num_turns:
          type: integer
          minimum: 0
    AgentSessionMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
        timestamp:
          type: string
        is_error:
          type: boolean
      required:
      - role
      - content
      - timestamp
    AgentSessionSummary:
      type: object
      properties:
        session_id:
          type: string
        sandbox_id:
          type: string
        sandbox_name:
          type: string
          nullable: true
        agent:
          type: string
        status:
          type: string
        preview:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        effort:
          type: string
          nullable: true
        started_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        ended_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - session_id
      - sandbox_id
      - sandbox_name
      - agent
      - status
      - preview
      - model
      - effort
      - started_at
      - ended_at
      - created_at
      - updated_at
    AgentSessionStreamFrame:
      anyOf:
      - type: object
        properties:
          phase:
            type: string
            enum:
            - creating_sandbox
            - sandbox_ready
          sandbox_id:
            type: string
        required:
        - phase
      - type: object
        properties:
          text:
            type: string
        required:
        - text
      - $ref: '#/components/schemas/AgentSessionSendResponse'
      - type: object
        properties:
          error:
            type: string
        required:
        - error
    AgentSessionSendRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        agent:
          type: string
          enum:
          - claude
          - codex
        session_id:
          type: string
          minLength: 1
        sandbox_id:
          type: string
          minLength: 1
        new_session:
          type: boolean
        model:
          type: string
          nullable: true
          enum:
          - fable
          - opus
          - sonnet
          - haiku
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna
          - gpt-5.5
          - gpt-5.2
          - null
        effort:
          type: string
          nullable: true
          enum:
          - low
          - medium
          - high
          - xhigh
          - max
          - null
        repo_url:
          type: string
          minLength: 1
        branch:
          type: string
          minLength: 1
        new_branch_name:
          type: string
          minLength: 1
      required:
      - message
    ListAgentSessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AgentSessionSummary'
        total:
          type: integer
          minimum: 0
      required:
      - sessions
      - total
    AgentSessionDetail:
      allOf:
      - $ref: '#/components/schemas/AgentSessionSummary'
      - type: object
        properties:
          messages:
            type: array
            items:
              $ref: '#/components/schemas/AgentSessionMessage'
        required:
        - messages
    AgentSessionEventFrame:
      type: object
      properties:
        seq:
          type: integer
          minimum: 0
        id:
          type: string
        kind:
          type: string
        payload:
          type: object
          additionalProperties:
            nullable: true
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - seq
      - id
      - kind
      - payload
      - created_at
    AgentSessionSendResponse:
      type: object
      properties:
        session_id:
          type: string
        sandbox_id:
          type: string
        agent:
          type: string
          enum:
          - claude
          - codex
        response:
          type: string
        is_error:
          type: boolean
          description: 'True when the turn failed. The failure is still a 200: `response` carries the agent CLI''s own message (e.g. "Not logged in · Please run /login").'
        is_new_session:
          type: boolean
        created_sandbox:
          type: boolean
        usage:
          $ref: '#/components/schemas/AgentSessionUsage'
      required:
      - session_id
      - sandbox_id
      - agent
      - response
      - is_error
      - is_new_session
      - created_sandbox
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token: an Amika CLI session token or an Amika API key.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: wos-session
      description: Browser session cookie set after sign-in.
