components:
  schemas:
    SandboxService:
      type: object
      properties:
        id:
          type: string
          nullable: true
        sandbox_id:
          type: string
        name:
          type: string
        port:
          type: integer
        url_scheme:
          type: string
          nullable: true
          enum:
          - http
          - https
          - null
        protocol:
          type: string
        url:
          type: string
          nullable: true
        host_port:
          type: integer
          nullable: true
        source:
          type: string
          enum:
          - table
          - legacy
        kind:
          type: string
          enum:
          - system
          - user
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
      required:
      - id
      - sandbox_id
      - name
      - port
      - url_scheme
      - protocol
      - url
      - host_port
      - source
      - kind
      - created_at
      - updated_at
    ListSandboxServicesResponse:
      type: object
      properties:
        items:
          type: array
          items:
