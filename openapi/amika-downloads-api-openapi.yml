    post:
      tags:
      - Downloads
      summary: Create a signed download URL for an object in the org's bucket
      security:
      - bearerAuth: []
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDownloadRequest'
      responses:
        '201':
          description: Signed download URL. GET `download_url` directly to fetch the object; valid for `expires_in` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '400':
          description: Error
          headers:
