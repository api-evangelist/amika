openapi: 3.1.0
info:
  title: Amika API — v0beta1 API keys Downloads API
  version: 0beta1
tags:
- name: Downloads
paths:
  /storage/downloads:
    get:
      tags:
      - Downloads
      summary: List the org's bucket as a batch of signed download URLs (one per object)
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - schema:
          type: string
        required: false
        name: prefix
        in: query
      - schema:
          type: string
        required: false
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 1000
        required: false
        name: limit
        in: query
      responses:
        '200':
          description: A page of objects, each with a signed `download_url`. Object `key`s preserve the bucket's directory structure, so a client can recreate the tree by writing each object to its `key`. URLs are valid for `expires_in` seconds; follow `next_cursor` for the next page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDownloadsResponse'
        '400':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '401':
          description: Error
