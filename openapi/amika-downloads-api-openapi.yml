components:
  schemas:
    ListDownloadsResponse:
      type: object
      properties:
        bucket:
          type: string
        prefix:
          type: string
        objects:
          type: array
          items:
            $ref: '#/components/schemas/DownloadObject'
        expires_in:
          type: integer
        next_cursor:
          type: string
          nullable: true
      required:
      - bucket
      - prefix
      - objects
      - expires_in
      - next_cursor
    DownloadResponse:
      type: object
      properties:
        bucket:
          type: string
        path:
          type: string
        download_url:
          type: string
        expires_in:
          type: integer
      required:
      - bucket
      - path
      - download_url
      - expires_in
    DownloadObject:
      type: object
      properties:
        key:
          type: string
        size:
          type: integer
        last_modified:
          type: string
        download_url:
          type: string
      required:
      - key
      - download_url
    CreateDownloadRequest:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
        download:
          type: boolean
          default: false
      required:
      - filename
