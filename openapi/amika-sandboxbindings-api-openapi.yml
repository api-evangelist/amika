components:
  schemas:
    CreateSandboxBindingRequest:
      anyOf:
      - type: object
        properties:
          target_url:
            type: string
            format: uri
        required:
        - target_url
        additionalProperties: false
      - type: object
        properties:
          target:
            type: object
            properties:
              kind:
                type: string
                enum:
                - github_branch
              repository:
                type: object
                properties:
                  owner:
                    type: string
                    minLength: 1
                    maxLength: 255
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
                required:
                - owner
                - name
                additionalProperties: false
              branch:
                type: string
                minLength: 1
                maxLength: 1024
            required:
            - kind
            - repository
            - branch
            additionalProperties: false
          rebind:
            type: boolean
            default: false
        required:
        - target
        additionalProperties: false
    SandboxBinding:
      type: object
      properties:
        id:
          type: string
        sandbox_id:
          type: string
        target_namespace:
          type: string
        target_kind:
          type: string
        target_id:
          type: string
        target_url:
          type: string
          format: uri
        relationship:
          type: string
        metadata:
          type: object
          additionalProperties:
            nullable: true
        system_metadata:
          type: object
          additionalProperties:
            nullable: true
        created_by_kind:
          type: string
          enum:
          - user
          - system
        created_by_id:
          type: string
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - id
      - sandbox_id
      - target_namespace
      - target_kind
      - target_id
      - target_url
      - relationship
      - metadata
      - system_metadata
      - created_by_kind
      - created_by_id
      - created_at
      - updated_at
    ListSandboxBindingsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SandboxBinding'
      required:
      - items
    CreateSandboxBindingResponse:
      type: object
      properties:
        id:
          type: string
      required:
      - id
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token: an Amika CLI session token or an Amika API key.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: wos-session
      description: Browser session cookie set after sign-in.
