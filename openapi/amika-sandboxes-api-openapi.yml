components:
  schemas:
    SshAccessResponse:
      type: object
      properties:
        ssh_destination:
          type: string
        token:
          type: string
        expires_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        sandbox_id:
          type: string
        sandbox_name:
          type: string
        repo_name:
          type: string
          nullable: true
        web_socket_proxy_url:
          type: string
        private_key:
          type: string
      required:
      - ssh_destination
      - token
      - expires_at
      - sandbox_id
      - sandbox_name
      - repo_name
    SandboxLifecycleEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SandboxLifecycleEvent'
        count:
          type: integer
      required:
      - events
      - count
    AgentSendResponse:
      type: object
      properties:
        session_id:
          type: string
        agent_session_id:
          type: string
        response:
          type: string
        is_error:
          type: boolean
        is_new_session:
          type: boolean
        cost_usd:
          type: number
      required:
      - session_id
      - response
      - is_error
      - is_new_session
    CreateSandboxRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        repo_url:
          type: string
        git_url:
          type: string
        github_url:
          type: string
        branch:
          type: string
          minLength: 1
        new_branch_name:
          type: string
          minLength: 1
        provider:
          type: string
          enum:
          - local-docker
          - daytona
          - freestyle
          - vercel
        auto_stop_interval:
          type: number
          minimum: 0
          maximum: 10080
        auto_delete_interval:
          type: number
          minimum: -1
          maximum: 10080
        amika_opencode_web:
          anyOf:
          - type: string
          - type: number
          - nullable: true
        env_vars:
          type: object
          additionalProperties:
            type: string
          default: {}
        secret_env_vars:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          default: {}
        disabled_repo_env_var_names:
          type: array
          items:
            type: string
            pattern: ^[A-Z_][A-Z0-9_]*$
          default: []
        setup_script_text:
          type: string
        skip_setup_script:
          type: boolean
          default: false
        agent_credentials:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - claude
                - codex
              name:
                type: string
                minLength: 1
              type:
                type: string
                enum:
                - oauth
                - api_key
              none:
                type: boolean
                enum:
                - true
            required:
            - kind
          default: []
        preset:
          type: string
          enum:
          - coder
          - coder-dind
          default: coder
        size:
          type: string
          enum:
          - xs
          - m
          - l
          - xl
          default: m
        snapshot:
          type: string
          nullable: true
          minLength: 1
        integration_ids:
          type: array
          items:
            type: string
          default: []
        initial_prompt:
          type: string
        agent:
          type: string
          enum:
          - claude
          - codex
        workflow:
          type: object
          properties:
            enabled:
              type: boolean
          required:
          - enabled
        github_auth_mode:
          type: string
          enum:
          - pat
          - app_token
      required:
      - name
    WorkflowEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              event_type:
                type: string
              id:
                type: string
              time:
                type: string
              step:
                type: string
              contents:
                nullable: true
            required:
            - event_type
            - id
            - time
        count:
          type: integer
        capped:
          type: boolean
      required:
      - events
      - count
      - capped
    CreateSessionRequest:
      type: object
      properties:
        agent_name:
          type: string
        metadata:
          type: object
          additionalProperties:
            nullable: true
      required:
      - agent_name
    ListSandboxesResponse:
      type: array
      items:
        $ref: '#/components/schemas/Sandbox'
    SandboxIntegrationsResponse:
      type: array
      items:
        type: object
        properties:
          sandbox_id:
            type: string
          name:
            type: string
          mcp_server_type:
            type: string
          mcp_server_url:
            type: string
        required:
        - sandbox_id
        - name
        - mcp_server_type
        - mcp_server_url
    AgentSendJobResponse:
      type: object
      properties:
        job_id:
          type: string
        state:
          type: string
        agent_session_id:
          type: string
          nullable: true
        is_new_session:
          type: boolean
        is_error:
          type: boolean
        result_text:
          type: string
          nullable: true
        cost_usd:
          type: number
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - job_id
      - state
      - agent_session_id
      - is_new_session
      - is_error
      - result_text
      - created_at
      - updated_at
    SlackConversationResponse:
      type: object
      properties:
        conversation:
          type: object
          nullable: true
          properties:
            conversation_id:
              type: string
            team_id:
              type: string
            team_name:
              type: string
              nullable: true
            channel_id:
              type: string
            channel_name:
              type: string
              nullable: true
            thread_id:
              type: string
            status:
              type: string
              nullable: true
            agent_name:
              type: string
              nullable: true
              enum:
              - claude
              - codex
              - null
            messages:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  author:
                    type: string
                  direction:
                    type: string
                    enum:
                    - inbound
                    - outbound
                  contents:
                    type: string
                  occurred_at:
                    anyOf:
                    - type: string
                    - type: string
                      format: date-time
                  is_error:
                    type: boolean
                required:
                - id
                - author
                - direction
                - contents
                - occurred_at
                - is_error
          required:
          - conversation_id
          - team_id
          - team_name
          - channel_id
          - channel_name
          - thread_id
          - status
          - agent_name
          - messages
      required:
      - conversation
    SandboxSlackMetadataResponse:
      type: object
      properties:
        metadata:
          type: object
          additionalProperties:
            type: object
            properties:
              conversation_id:
                type: string
                nullable: true
              team_id:
                type: string
              team_name:
                type: string
                nullable: true
              team_icon_url:
                type: string
                nullable: true
              channel_id:
                type: string
              channel_name:
                type: string
                nullable: true
              thread_id:
                type: string
              preview:
                type: string
                nullable: true
              status:
                type: string
                nullable: true
              agent_name:
                type: string
                nullable: true
                enum:
                - claude
                - codex
                - null
            required:
            - conversation_id
            - team_id
            - team_name
            - team_icon_url
            - channel_id
            - channel_name
            - thread_id
            - preview
            - status
            - agent_name
      required:
      - metadata
    SandboxLifecycleEvent:
      type: object
      properties:
        id:
          type: string
        run_kind:
          type: string
        step:
          type: string
        status:
          type: string
        detail:
          type: string
          nullable: true
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - id
      - run_kind
      - step
      - status
      - detail
      - created_at
    RevokeSshRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    AgentSendJobRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        new_session:
          type: boolean
          default: false
        session_id:
          type: string
        agent:
          type: string
      required:
      - message
    UpdateSessionRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - active
          - completed
          - failed
        metadata:
          type: object
          additionalProperties:
            nullable: true
    AgentSendRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        new_session:
          type: boolean
          default: false
        session_id:
          type: string
        agent:
          type: string
      required:
      - message
    AgentSessionsList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'
        total:
          type: integer
          minimum: 0
      required:
      - sessions
      - total
    Sandbox:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
          nullable: true
        org_id:
          type: string
        name:
          type: string
        provider:
          type: string
          nullable: true
        provider_sandbox_id:
          type: string
          nullable: true
        provider_url:
          type: string
          nullable: true
        amika_opencode_web:
          type: string
          nullable: true
        repo_name:
          type: string
          nullable: true
        repo_provider:
          type: string
          nullable: true
        repo_id:
          type: string
          nullable: true
        repo_url:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        commit_hash:
          type: string
          nullable: true
        snapshot:
          type: string
          nullable: true
        snapshot_name:
          type: string
          nullable: true
        sandbox_preset:
          type: string
          nullable: true
        sandbox_size:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        current_session_id:
          type: string
          nullable: true
        services:
          type: array
          nullable: true
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
              hostPort:
                type: integer
              containerPort:
                type: integer
              protocol:
                type: string
            required:
            - name
            - url
            - hostPort
            - containerPort
            - protocol
        state:
          type: string
        status:
          type: string
          enum:
          - creating
          - starting
          - running
          - stopping
          - suspending
          - suspended
          - snapshotting
          - failed
          - unknown
        setup_status:
          type: string
          nullable: true
          enum:
          - ok
          - setup-running
          - git-failed
          - setup-failed
          - sys-setup-failed
          - null
        urls_expire_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
        secret_names:
          type: array
          items:
            type: string
        has_workflow:
          type: boolean
        resolved_agent_credentials:
          type: array
          items:
            oneOf:
            - type: object
              properties:
                kind:
                  type: string
                outcome:
                  type: string
                  enum:
                  - resolved
                name:
                  type: string
                type:
                  type: string
                  enum:
                  - oauth
                  - api_key
                source:
                  type: string
              required:
              - kind
              - outcome
              - name
              - type
              - source
            - type: object
              properties:
                kind:
                  type: string
                outcome:
                  type: string
                  enum:
                  - skipped
                reason:
                  type: string
                  enum:
                  - request:none
                  - no_user_credential
              required:
              - kind
              - outcome
              - reason
        created_by:
          type: object
          nullable: true
          properties:
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
          required:
          - name
          - email
        origin:
          type: string
          nullable: true
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - id
      - user_id
      - org_id
      - name
      - provider
      - provider_sandbox_id
      - provider_url
      - amika_opencode_web
      - repo_name
      - repo_provider
      - repo_id
      - repo_url
      - branch
      - commit_hash
      - snapshot
      - current_session_id
      - services
      - created_at
      - updated_at
      additionalProperties:
        nullable: true
    AgentSession:
      type: object
      properties:
        id:
          type: string
        sandbox_id:
          type: string
        org_id:
          type: string
        agent_name:
          type: string
        status:
          type: string
        started_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        ended_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
          - nullable: true
        metadata:
          type: object
          additionalProperties:
            nullable: true
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - id
      - sandbox_id
      - org_id
      - agent_name
      - status
      - started_at
      - ended_at
      - metadata
      - created_at
      - updated_at
    OkStatus:
      type: object
      properties:
        ok:
          type: boolean
          enum:
          - true
      required:
      - ok
