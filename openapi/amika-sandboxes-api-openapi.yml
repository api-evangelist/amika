components:
  schemas:
    SlackConversationResponse:
      type: object
      properties:
        conversation:
          type: object
          nullable: true
          properties:
            conversation_id:
              type: string
            team_id:
              type: string
            team_name:
              type: string
              nullable: true
            channel_id:
              type: string
            channel_name:
              type: string
              nullable: true
            thread_id:
              type: string
            status:
              type: string
              nullable: true
            agent_name:
              type: string
              nullable: true
              enum:
              - claude
              - codex
              - null
            messages:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  author:
                    type: string
                  direction:
                    type: string
                    enum:
                    - inbound
                    - outbound
                  contents:
                    type: string
                  occurred_at:
                    anyOf:
                    - type: string
                    - type: string
                      format: date-time
                  is_error:
                    type: boolean
                required:
                - id
                - author
                - direction
                - contents
                - occurred_at
                - is_error
          required:
          - conversation_id
          - team_id
          - team_name
          - channel_id
          - channel_name
          - thread_id
          - status
          - agent_name
          - messages
      required:
      - conversation
    DirectWebSocketSshSessionResponse:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
        transport:
          type: string
          enum:
          - direct_ws
        connect_url:
          type: string
          format: uri
        connect_credential:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        sandbox_id:
          type: string
          minLength: 1
        ssh_user:
          type: string
          enum:
          - amika
        host_public_key:
          type: string
          pattern: '^ssh-ed25519 [A-Za-z0-9+/]+={0,3}(?: [^\r\n]+)?$'
      required:
      - session_id
      - transport
      - connect_url
      - connect_credential
      - sandbox_id
      - ssh_user
      - host_public_key
    SandboxService:
      type: object
      properties:
        id:
          type: string
          nullable: true
        sandbox_id:
          type: string
        name:
          type: string
        port:
          type: integer
        url_scheme:
          type: string
          nullable: true
          enum:
          - http
          - https
          - null
        protocol:
          type: string
        url:
          type: string
          nullable: true
        host_port:
          type: integer
          nullable: true
        source:
          type: string
          enum:
          - table
          - legacy
