openapi: 3.2.0
info:
  title: Amika API keys API
  version: 0beta
  description: HTTP API for Amika coding agents. Versioned per Google AIP-185.
tags:
- name: API Keys
paths:
  /api/v0beta1/api-keys:
    get:
      tags:
      - API Keys
      summary: List API keys
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - schema:
          type: string
          enum:
          - organization
          - user
          description: Restrict the listing to a single scope. Omit to list both organization- and user-scoped keys merged together.
          example: organization
        required: false
        description: Restrict the listing to a single scope. Omit to list both organization- and user-scoped keys merged together.
        name: scope
        in: query
      - schema:
          type: string
          minLength: 1
          description: Pagination cursor returned by a previous list call.
          example: cursor-2
        required: false
        description: Pagination cursor returned by a previous list call.
        name: after
        in: query
      - schema:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          description: Maximum number of API keys to return.
          example: 25
        required: false
        description: Maximum number of API keys to return.
        name: limit
        in: query
      responses:
        '200':
          description: 'Page of API keys visible to the caller: organization-scoped keys for their org plus user-scoped keys they own, unless narrowed with `scope`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiKeysResponse'
        '400':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '403':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
      operationId: getApiV0beta1ApiKeys
      x-operation-id-source: derived
    post:
      tags:
      - API Keys
      summary: Create an API key
      security:
      - bearerAuth: []
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Created API key, including its plaintext value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithValue'
        '400':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '403':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
      operationId: postApiV0beta1ApiKeys
      x-operation-id-source: derived
  /api/v0beta1/api-keys/{id}:
    delete:
      tags:
      - API Keys
      summary: Delete an API key
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
          description: WorkOS API key id.
          example: key_01H...
        required: true
        description: WorkOS API key id.
        name: id
        in: path
      - schema:
          type: string
          enum:
          - organization
          - user
          default: organization
          description: Scope of the key to delete. Defaults to `organization`; pass `user` to revoke a user-scoped key.
          example: organization
        required: false
        description: Scope of the key to delete. Defaults to `organization`; pass `user` to revoke a user-scoped key.
        name: scope
        in: query
      responses:
        '204':
          description: API key deleted.
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '403':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '404':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
      operationId: deleteApiV0beta1ApiKeysById
      x-operation-id-source: derived
components:
  schemas:
    ApiKeySummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          type: string
          enum:
          - organization
          - user
          description: Whether the key is scoped to the caller's organization or to the individual user who owns it.
          example: organization
        obfuscatedValue:
          type: string
        lastUsedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - name
      - scope
      - obfuscatedValue
      - lastUsedAt
      - createdAt
      - updatedAt
    ListApiKeysResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeySummary'
        pageInfo:
          type: object
          properties:
            after:
              type: string
              nullable: true
            hasNextPage:
              type: boolean
          required:
          - after
          - hasNextPage
      required:
      - data
      - pageInfo
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable name for the API key.
        scope:
          type: string
          enum:
          - organization
          - user
          default: organization
          description: Scope of the key to create. Defaults to `organization`; pass `user` to mint a key owned by the calling user.
          example: organization
      required:
      - name
    ApiKeyWithValue:
      allOf:
      - $ref: '#/components/schemas/ApiKeySummary'
      - type: object
        properties:
          value:
            type: string
        required:
        - value
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token: an Amika CLI session token or an Amika API key.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: wos-session
      description: Browser session cookie set after sign-in.
