components:
  schemas:
    SecretSummary:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        user_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        scope:
          type: string
          enum:
          - user
          - org
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - id
      - org_id
      - user_id
      - name
      - description
      - scope
      - created_at
      - updated_at
    UpsertOpencodeRequest:
      type: object
      properties:
        password:
          type: string
        passwordEnabled:
          type: boolean
      required:
      - password
      - passwordEnabled
    ListSecretsResponse:
      type: array
      items:
        $ref: '#/components/schemas/SecretSummary'
    UpdateSecretRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        scope:
          type: string
          enum:
          - user
          - org
        description:
          type: string
          nullable: true
    ListCredentialsResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          name:
            type: string
          type:
            type: string
            enum:
            - oauth
            - api_key
          scope:
            type: string
            enum:
            - user
            - org
        required:
        - id
        - name
        - type
        - scope
    RevealSecretResponse:
      type: object
      properties:
        value:
          type: string
      required:
      - value
    CreateCredentialRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - oauth
          - api_key
        scope:
          type: string
          enum:
          - user
          - org
      required:
      - name
      - value
      - type
    CreateCodexCredentialRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - oauth
          - api_key
        scope:
          type: string
          enum:
          - user
          - org
      required:
      - name
      - value
      - type
    CreateSecretRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        scope:
          type: string
          enum:
          - user
          - org
        description:
          type: string
          nullable: true
      required:
      - name
      - value
    OpencodeStatus:
      type: object
      properties:
        configured:
          type: boolean
        secretId:
          type: string
          nullable: true
        passwordEnabled:
          type: boolean
      required:
      - configured
