components:
  schemas:
    CreateSecretRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        scope:
          type: string
          enum:
          - user
          - org
        description:
          type: string
          nullable: true
      required:
      - name
      - value
    PiStatus:
      type: object
      properties:
        configured:
          type: boolean
        secretId:
          type: string
          nullable: true
      required:
      - configured
    UpsertPiRequest:
      type: object
      properties:
        authJson:
          type: string
          minLength: 1
        source:
          type: object
          properties:
            agent:
              type: string
              enum:
              - claude
              - codex
            secretId:
              type: string
              minLength: 1
          required:
          - agent
          - secretId
    ListCredentialsResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          name:
            type: string
          type:
            type: string
            enum:
            - oauth
            - api_key
          scope:
            type: string
            enum:
            - user
            - org
        required:
        - id
        - name
        - type
        - scope
    UpdateSecretRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        scope:
          type: string
          enum:
          - user
          - org
        description:
          type: string
          nullable: true
    RevealSecretResponse:
      type: object
      properties:
        value:
          type: string
      required:
      - value
    ListSshPublicKeysResponse:
      type: array
      items:
        $ref: '#/components/schemas/SshPublicKeySummary'
    SshPublicKeySummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        public_key:
          type: string
        scope:
          type: string
          enum:
          - user
      required:
      - id
      - name
      - public_key
      - scope
    ListSecretsResponse:
      type: array
      items:
        $ref: '#/components/schemas/SecretSummary'
    UpsertSshPublicKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        public_key:
          type: string
          minLength: 1
          maxLength: 1024
      required:
      - name
      - public_key
    CreateCodexCredentialRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - oauth
          - api_key
        scope:
          type: string
          enum:
          - user
          - org
      required:
      - name
      - value
      - type
    SecretSummary:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        user_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        scope:
          type: string
          enum:
          - user
          - org
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - id
      - org_id
      - user_id
      - name
      - description
      - scope
      - created_at
      - updated_at
    CreateCredentialRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - oauth
          - api_key
        scope:
          type: string
          enum:
          - user
          - org
      required:
      - name
      - value
      - type
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token: an Amika CLI session token or an Amika API key.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: wos-session
      description: Browser session cookie set after sign-in.
