components:
  schemas:
    RevealHostSecretResponse:
      type: object
      properties:
        value:
          type: string
      required:
      - value
    ReplaceHostRequest:
      type: object
      properties:
        hostname:
          type: string
        url:
          type: string
          nullable: true
          format: uri
        secret:
          type: string
          pattern: ^[\x21-\x7e]{32,}$
        sizes:
          type: object
          additionalProperties:
            type: object
            properties:
              vcpus:
                type: integer
                minimum: 1
              memoryGib:
                type: number
                minimum: 0
                exclusiveMinimum: true
              diskGib:
                type: integer
                minimum: 1
              diskGrowOnly:
                type: boolean
            required:
            - vcpus
            - memoryGib
            - diskGib
            - diskGrowOnly
            additionalProperties: false
      required:
      - hostname
    Host:
      type: object
      properties:
        id:
          type: string
          pattern: ^host_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        hostname:
          type: string
        url:
          type: string
          nullable: true
        org_id:
          type: string
        sizes:
          type: object
          additionalProperties:
            type: object
            properties:
              vcpus:
                type: integer
                minimum: 1
              memoryGib:
                type: number
                minimum: 0
                exclusiveMinimum: true
              diskGib:
                type: integer
                minimum: 1
              diskGrowOnly:
                type: boolean
            required:
            - vcpus
            - memoryGib
            - diskGib
            - diskGrowOnly
            additionalProperties: false
        created_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
        updated_at:
          anyOf:
          - type: string
          - type: string
            format: date-time
      required:
      - id
      - hostname
      - url
      - org_id
      - sizes
      - created_at
      - updated_at
    CreateHostRequest:
      type: object
      properties:
        hostname:
          type: string
        url:
          type: string
          nullable: true
          format: uri
        secret:
          type: string
          pattern: ^[\x21-\x7e]{32,}$
        sizes:
          type: object
          additionalProperties:
            type: object
            properties:
              vcpus:
                type: integer
                minimum: 1
              memoryGib:
                type: number
                minimum: 0
                exclusiveMinimum: true
              diskGib:
                type: integer
                minimum: 1
              diskGrowOnly:
                type: boolean
            required:
            - vcpus
            - memoryGib
            - diskGib
            - diskGrowOnly
            additionalProperties: false
      required:
      - hostname
      - secret
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token: an Amika CLI session token or an Amika API key.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: wos-session
      description: Browser session cookie set after sign-in.
