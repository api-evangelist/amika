      - Slack
      summary: Read the org's Slack settings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Slack settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlackOrgSettings'
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '403':
          description: Error
          headers:
            x-trace-id:
