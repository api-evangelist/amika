openapi: 3.2.0
info:
  title: Amika Integrations API
  version: 0beta
  description: HTTP API for Amika coding agents. Versioned per Google AIP-185.
tags:
- name: Integrations
paths:
  /api/v0beta1/integrations/credentials:
    get:
      tags:
      - Integrations
      summary: List the caller's connected integrations
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Connected integration providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntegrationCredentialsResponse'
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '403':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
      operationId: getApiV0beta1IntegrationsCredentials
      x-operation-id-source: derived
  /api/v0beta1/integrations/{provider}/credentials:
    delete:
      tags:
      - Integrations
      summary: Disconnect an integration provider for the caller
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: provider
        in: path
      responses:
        '204':
          description: Disconnected.
        '401':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
        '403':
          description: Error
          headers:
            x-trace-id:
              description: Per-request trace id for correlating responses with logs.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - error
                  error_code:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      nullable: true
                  trace_id:
                    type: string
                required:
                - type
                - error_code
                - message
      operationId: deleteApiV0beta1IntegrationsByProviderCredentials
      x-operation-id-source: derived
components:
  schemas:
    ListIntegrationCredentialsResponse:
      type: array
      items:
        type: object
        properties:
          provider:
            type: string
          connected:
            type: boolean
        required:
        - provider
        - connected
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token: an Amika CLI session token or an Amika API key.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: wos-session
      description: Browser session cookie set after sign-in.
x-provenance:
  method: harvested
  publisher: Amika
  source: https://app.amika.dev/api/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
