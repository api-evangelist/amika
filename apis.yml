name: Amika
description: >-
  Amika is a Y Combinator-backed infrastructure company for running AI coding
  agents in isolated cloud sandboxes. Teams spawn agents from Slack, Linear,
  GitHub, a CLI, a TypeScript SDK, or the hosted HTTP API to understand a
  codebase, run in a root-access VM, execute programmable checks (tests,
  linters, type checkers), and open validated pull requests autonomously. The
  platform exposes a REST API (v0beta1) for managing repositories, sandboxes,
  snapshots, agent sessions, secrets, services, storage, and Slack integration,
  with API-key and OAuth device-flow authentication. Core primitives are shipped
  open source under the gofixpoint GitHub organization, including the amika CLI,
  the amikalog session-capture tool, and the @amika/sdk TypeScript client.
